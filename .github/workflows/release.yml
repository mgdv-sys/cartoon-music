name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package AppImage
        run: |
          curl -Lo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPDIR=Playah.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp assets/icon/playah_icon.png "$APPDIR/playah.png"
          ln -s playah.png "$APPDIR/.DirIcon"
          cat > "$APPDIR/playah.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Playah
          Comment=A cartoon-styled music player
          Exec=cartoon_music
          Icon=playah
          Terminal=false
          Categories=AudioVideo;Audio;Player;
          StartupWMClass=com.cartoonmusic.cartoon_music
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/cartoon_music" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          ./appimagetool --no-appstream "$APPDIR" Playah-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Playah-linux-appimage
          path: Playah-x86_64.AppImage

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip release bundle
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Playah-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Playah-windows
          path: Playah-windows.zip

  release:
    needs: [linux-appimage, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Playah-linux-appimage/Playah-x86_64.AppImage
            artifacts/Playah-windows/Playah-windows.zip
